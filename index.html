<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>VEA Admin Chat</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f5f7;
}

body{
    display:flex;
    flex-direction:column;
}

/* =========================
   HEADER
========================= */

.topbar{
    height:64px;
    flex-shrink:0;
    background:#087f3e;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    z-index:20;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:bold;
    font-size:20px;
}

.brand-icon{
    width:38px;
    height:38px;
    border-radius:50%;
    background:white;
    color:#087f3e;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:16px;
}

.admin-info{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:14px;
}

.admin-name{
    font-weight:bold;
}

.logout-btn{
    border:1px solid rgba(255,255,255,.7);
    background:transparent;
    color:white;
    border-radius:7px;
    padding:8px 12px;
    cursor:pointer;
}

.logout-btn:hover{
    background:rgba(255,255,255,.15);
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    min-height:0;
    display:flex;
    position:relative;
}

/* =========================
   CLIENT LIST
========================= */

.clients{
    width:300px;
    flex-shrink:0;
    background:white;
    border-right:1px solid #d8dee3;
    display:flex;
    flex-direction:column;
    z-index:5;
}

.clients-title{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    border-bottom:1px solid #e1e5e8;
    font-weight:bold;
    color:#14532d;
}

.client-count{
    min-width:26px;
    height:26px;
    padding:0 7px;
    border-radius:20px;
    background:#e8f5ed;
    color:#087f3e;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
}

.client-list{
    flex:1;
    min-height:0;
    overflow-y:auto;
}

.client-item{
    position:relative;
    padding:14px 14px;
    border-bottom:1px solid #edf0f2;
    cursor:pointer;
    transition:.15s;
}

.client-item:hover{
    background:#f3faf6;
}

.client-item.active{
    background:#e8f5ed;
    border-left:4px solid #087f3e;
    padding-left:10px;
}

.client-name-row{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
}

.client-name{
    font-weight:bold;
    color:#1e293b;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    flex-shrink:0;
}

.status-dot.online{
    background:#16a34a;
}

.status-dot.offline{
    background:#94a3b8;
}

.client-preview{
    margin-top:5px;
    color:#64748b;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    padding-right:28px;
}

.unread{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    min-width:22px;
    height:22px;
    padding:0 6px;
    border-radius:20px;
    background:#ef4444;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:bold;
}

/* =========================
   CHAT PANEL
========================= */

.chat-panel{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:#f7f9fa;
    position:relative;
}

.chat-header{
    height:64px;
    flex-shrink:0;
    background:white;
    border-bottom:1px solid #dce2e6;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 18px;
    z-index:2;
}

.chat-header-info{
    min-width:0;
}

.chat-header-name{
    font-size:17px;
    font-weight:bold;
    color:#14532d;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-header-status{
    margin-top:3px;
    font-size:12px;
    color:#64748b;
}

.back-btn{
    display:none;
    border:0;
    background:#087f3e;
    color:white;
    border-radius:7px;
    padding:9px 12px;
    font-weight:bold;
    cursor:pointer;
    flex-shrink:0;
}

.delete-btn{
    margin-left:auto;
    border:0;
    background:#dc2626;
    color:white;
    border-radius:7px;
    padding:9px 12px;
    font-weight:bold;
    cursor:pointer;
    flex-shrink:0;
}

.delete-btn:hover{
    background:#b91c1c;
}

/* =========================
   MESSAGES
========================= */

.messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.empty-chat{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#94a3b8;
    font-size:14px;
}

.message-row{
    display:flex;
    width:100%;
}

.message-row.client{
    justify-content:flex-start;
}

.message-row.admin{
    justify-content:flex-end;
}

.message{
    max-width:min(75%,650px);
    padding:10px 13px;
    border-radius:12px;
    font-size:14px;
    line-height:1.45;
    word-wrap:break-word;
    overflow-wrap:anywhere;
}

/* CLIENT MESSAGE - LIGHT BLUE */
.message.client{
    background:#dff3ff;
    color:#123;
    border:1px solid #b9e5f7;
    border-left:4px solid #2196f3;
    border-top-left-radius:4px;
}

/* ADMIN MESSAGE */
.message.admin{
    background:#087f3e;
    color:white;
    border-top-right-radius:4px;
}

.message-meta{
    margin-top:5px;
    font-size:10px;
    opacity:.65;
}

.image-message{
    padding:6px;
    background:white !important;
    border:1px solid #d7dde1 !important;
}

.image-message img{
    display:block;
    max-width:300px;
    max-height:300px;
    width:auto;
    height:auto;
    border-radius:8px;
    object-fit:contain;
}

.photo-status{
    padding:8px 10px;
    color:#64748b;
    font-size:12px;
    background:#f1f5f9;
    border-radius:7px;
}

/* =========================
   INPUT
========================= */

.chat-input-area{
    flex-shrink:0;
    background:white;
    border-top:1px solid #dce2e6;
    padding:10px;
    display:flex;
    gap:8px;
    align-items:flex-end;
}

.message-input{
    flex:1;
    min-width:0;
    min-height:42px;
    max-height:120px;
    resize:none;
    border:1px solid #cbd5e1;
    border-radius:9px;
    padding:11px 12px;
    font-family:Arial,Helvetica,sans-serif;
    font-size:14px;
    outline:none;
}

.message-input:focus{
    border-color:#087f3e;
    box-shadow:0 0 0 2px rgba(8,127,62,.08);
}

.file-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:9px;
    background:#e8f5ed;
    color:#087f3e;
    font-size:20px;
    cursor:pointer;
    flex-shrink:0;
}

.send-btn{
    height:42px;
    padding:0 17px;
    border:0;
    border-radius:9px;
    background:#087f3e;
    color:white;
    font-weight:bold;
    cursor:pointer;
    flex-shrink:0;
}

.send-btn:hover,
.file-btn:hover{
    opacity:.9;
}

.file-input{
    display:none;
}

.upload-status{
    position:absolute;
    left:50%;
    bottom:70px;
    transform:translateX(-50%);
    background:rgba(0,0,0,.78);
    color:white;
    padding:8px 13px;
    border-radius:8px;
    font-size:12px;
    display:none;
    z-index:10;
}

/* =========================
   LOGIN
========================= */

.login-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
}

.login-box{
    width:min(92%,380px);
    background:white;
    border-radius:14px;
    padding:25px;
    box-shadow:0 15px 45px rgba(0,0,0,.25);
}

.login-box h2{
    margin:0 0 8px;
    color:#087f3e;
}

.login-box p{
    margin:0 0 18px;
    color:#64748b;
    font-size:14px;
}

.login-input{
    width:100%;
    height:45px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    padding:0 12px;
    outline:none;
    font-size:14px;
}

.login-input:focus{
    border-color:#087f3e;
}

.login-submit{
    width:100%;
    height:45px;
    margin-top:12px;
    border:0;
    border-radius:8px;
    background:#087f3e;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .topbar{
        height:58px;
        padding:0 12px;
    }

    .brand{
        font-size:16px;
        gap:8px;
    }

    .brand-icon{
        width:32px;
        height:32px;
        font-size:13px;
    }

    .admin-info{
        font-size:12px;
        gap:6px;
    }

    .logout-btn{
        padding:7px 9px;
        font-size:11px;
    }

    .main{
        position:relative;
    }

    .clients{
        width:100%;
        border-right:0;
    }

    .clients-title{
        height:54px;
    }

    .chat-panel{
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        display:none;
        z-index:10;
    }

    .chat-panel.mobile-open{
        display:flex;
    }

    .back-btn{
        display:block;
    }

    .chat-header{
        height:58px;
        padding:0 10px;
        gap:8px;
    }

    .chat-header-name{
        font-size:15px;
    }

    .delete-btn{
        padding:8px 9px;
        font-size:11px;
    }

    .messages{
        padding:12px;
    }

    .message{
        max-width:88%;
        font-size:14px;
    }

    .image-message img{
        max-width:250px;
        max-height:250px;
    }

    .chat-input-area{
        padding:8px;
        gap:6px;
    }

    .message-input{
        min-height:42px;
        font-size:14px;
    }

    .send-btn{
        padding:0 13px;
    }

}

/* VERY SMALL SCREEN */

@media(max-width:380px){

    .admin-name{
        display:none;
    }

    .message{
        max-width:92%;
    }

    .file-btn{
        width:38px;
    }

    .send-btn{
        padding:0 10px;
    }

}
</style>

</head>

<body>

<div class="topbar">


<div class="brand">
    <div class="brand-icon">VEA</div>
    <div>VEA ADMIN CHAT</div>
</div>

<div class="admin-info">
    <span>Admin:</span>
    <span class="admin-name" id="adminNameDisplay">Admin</span>
    <button class="logout-btn" id="logoutBtn">Logout</button>
</div>


</div>

<div class="main">


<!-- CLIENT LIST -->

<aside class="clients">

    <div class="clients-title">
        <span>CLIENTS</span>
        <span class="client-count" id="clientCount">0</span>
    </div>

    <div class="client-list" id="clientList"></div>

</aside>


<!-- CHAT PANEL -->

<section class="chat-panel" id="chatPanel">

    <div class="chat-header">

        <button class="back-btn" id="backBtn">← BACK</button>

        <div class="chat-header-info">

            <div class="chat-header-name" id="chatClientName">
                Select a client
            </div>

            <div class="chat-header-status" id="chatClientStatus">
                No client selected
            </div>

        </div>

        <button class="delete-btn" id="deleteBtn">
            DELETE CHAT
        </button>

    </div>


    <div class="messages" id="messages">

        <div class="empty-chat" id="emptyChat">
            Select a client to view the conversation.
        </div>

    </div>


    <div class="chat-input-area">

        <input
            type="file"
            id="fileInput"
            class="file-input"
            accept="image/*"
        >

        <button
            class="file-btn"
            id="fileBtn"
            title="Send Photo"
        >
            📷
        </button>

        <textarea
            id="messageInput"
            class="message-input"
            placeholder="Type your message..."
            rows="1"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
        >
            SEND
        </button>

    </div>

    <div class="upload-status" id="uploadStatus">
        Uploading photo...
    </div>

</section>


</div>

<!-- LOGIN -->

<div class="login-overlay" id="loginOverlay">


<div class="login-box">

    <h2>VEA Admin Chat</h2>

    <p>
        Enter your admin name to continue.
    </p>

    <input
        type="text"
        id="adminNameInput"
        class="login-input"
        placeholder="Admin name"
        autocomplete="off"
    >

    <button
        id="loginBtn"
        class="login-submit"
    >
        ENTER CHAT
    </button>

</div>


</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    onChildAdded,
    push,
    set,
    remove
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

import {
    getStorage,
    ref as storageRef,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-storage.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
    apiKey: "AIzaSyAA84vFwWq2oh-7dyiWL6NnKx7Pz-3tGHY",
    authDomain: "vea-chat.firebaseapp.com",
    projectId: "vea-chat",
    storageBucket: "vea-chat.firebasestorage.app",
    messagingSenderId: "955537420473",
    appId: "1:955537420473:web:d2f4919127ce947dce6b68",
    measurementId: "G-VGJ8Q608NV",
    databaseURL: "https://vea-chat-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);
const storage = getStorage(app);


/* =========================
   ELEMENTS
========================= */

const loginOverlay = document.getElementById("loginOverlay");
const adminNameInput = document.getElementById("adminNameInput");
const loginBtn = document.getElementById("loginBtn");
const adminNameDisplay = document.getElementById("adminNameDisplay");
const logoutBtn = document.getElementById("logoutBtn");

const clientList = document.getElementById("clientList");
const clientCount = document.getElementById("clientCount");

const chatPanel = document.getElementById("chatPanel");
const backBtn = document.getElementById("backBtn");

const chatClientName = document.getElementById("chatClientName");
const chatClientStatus = document.getElementById("chatClientStatus");

const messagesBox = document.getElementById("messages");
const emptyChat = document.getElementById("emptyChat");

const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

const fileInput = document.getElementById("fileInput");
const fileBtn = document.getElementById("fileBtn");

const deleteBtn = document.getElementById("deleteBtn");
const uploadStatus = document.getElementById("uploadStatus");


/* =========================
   STATE
========================= */

let adminName = localStorage.getItem("veaAdminName") || "";

let selectedClientId = null;
let selectedClientData = null;

const messageListeners = {};
const displayedMessages = new Set();

let allChats = {};


/* =========================
   LOGIN
========================= */

function updateLogin(){

    if(adminName){

        adminNameDisplay.textContent = adminName;
        loginOverlay.style.display = "none";

    }else{

        loginOverlay.style.display = "flex";
        adminNameInput.focus();

    }

}

updateLogin();


loginBtn.addEventListener("click", login);


adminNameInput.addEventListener("keydown", function(e){

    if(e.key === "Enter"){
        login();
    }

});


function login(){

    const name = adminNameInput.value.trim();

    if(!name){

        alert("Please enter your admin name.");
        return;

    }

    adminName = name;

    localStorage.setItem("veaAdminName", adminName);

    updateLogin();

}


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener("click", function(){

    if(!confirm("Logout admin?")){
        return;
    }

    localStorage.removeItem("veaAdminName");

    adminName = "";

    selectedClientId = null;
    selectedClientData = null;

    closeMobileChat();

    updateLogin();

});


/* =========================
   MOBILE
========================= */

function isMobile(){

    return window.innerWidth <= 700;

}


function openMobileChat(){

    if(!isMobile()){
        return;
    }

    chatPanel.classList.add("mobile-open");

}


function closeMobileChat(){

    if(!isMobile()){
        return;
    }

    chatPanel.classList.remove("mobile-open");

}


backBtn.addEventListener("click", function(){

    closeMobileChat();

});


window.addEventListener("resize", function(){

    if(!isMobile()){

        chatPanel.classList.remove("mobile-open");

    }

});


/* =========================
   LOAD CLIENTS
========================= */

const chatsRef = ref(db, "chats");

onValue(chatsRef, function(snapshot){

    allChats = snapshot.val() || {};

    renderClients();

});


function renderClients(){

    clientList.innerHTML = "";

    const ids = Object.keys(allChats);

    clientCount.textContent = ids.length;

    if(ids.length === 0){

        clientList.innerHTML = `
            <div style="
                padding:25px;
                text-align:center;
                color:#94a3b8;
                font-size:13px;
            ">
                No clients yet.
            </div>
        `;

        return;

    }


    ids.sort(function(a,b){

        const ta = Number(allChats[a]?.lastMessageTime || 0);
        const tb = Number(allChats[b]?.lastMessageTime || 0);

        return tb - ta;

    });


    ids.forEach(function(clientId){

        const client = allChats[clientId] || {};

        const item = document.createElement("div");

        item.className = "client-item";

        if(clientId === selectedClientId){

            item.classList.add("active");

        }


        const messages = client.messages || {};

        let messageArray = Object.values(messages);

        messageArray.sort(function(a,b){

            return Number(a.timestamp || 0) -
                   Number(b.timestamp || 0);

        });


        const lastMessage =
            messageArray[messageArray.length - 1];


        let preview = "No messages";

        if(lastMessage){

            if(lastMessage.type === "image"){

                preview = "📷 Photo";

            }else{

                preview = lastMessage.text || "Message";

            }

        }


        const unreadCount =
            Number(client.unreadForAdmin || 0);


        const online =
            client.online === true;


        item.innerHTML = `

            <div class="client-name-row">

                <span class="status-dot ${online ? "online" : "offline"}"></span>

                <span class="client-name">
                    ${escapeHTML(client.name || "Unknown Client")}
                </span>

            </div>

            <div class="client-preview">
                ${escapeHTML(preview)}
            </div>

            ${
                unreadCount > 0
                ?
                `<div class="unread">${unreadCount > 99 ? "99+" : unreadCount}</div>`
                :
                ""
            }

        `;


        item.addEventListener("click", function(){

            selectClient(clientId);

        });


        clientList.appendChild(item);

    });

}


/* =========================
   SELECT CLIENT
========================= */

function selectClient(clientId){

    selectedClientId = clientId;

    selectedClientData = allChats[clientId] || {};

    chatClientName.textContent =
        selectedClientData.name || "Unknown Client";


    chatClientStatus.textContent =
        selectedClientData.online === true
        ? "Online"
        : "Offline";


    messagesBox.innerHTML = "";

    displayedMessages.clear();


    const messageValues =
        Object.entries(selectedClientData.messages || {});


    messageValues.sort(function(a,b){

        return Number(a[1].timestamp || 0) -
               Number(b[1].timestamp || 0);

    });


    if(messageValues.length === 0){

        messagesBox.innerHTML = `
            <div class="empty-chat">
                No messages yet.
            </div>
        `;

    }else{

        messageValues.forEach(function(entry){

            const messageId = entry[0];
            const message = entry[1];

            displayMessage(messageId, message);

        });

    }


    const clientRef =
        ref(db, "chats/" + clientId);


    set(
        ref(db, "chats/" + clientId + "/unreadForAdmin"),
        0
    );


    if(messageListeners[clientId]){

        messageListeners[clientId]();

    }


    messageListeners[clientId] =
        onChildAdded(
            ref(db, "chats/" + clientId + "/messages"),
            function(snapshot){

                const messageId = snapshot.key;
                const message = snapshot.val();

                displayMessage(messageId, message);

            }
        );


    renderClients();

    scrollMessages();

    openMobileChat();

}


/* =========================
   DISPLAY MESSAGE
========================= */

function displayMessage(messageId, message){

    if(!messageId || !message){
        return;
    }


    if(displayedMessages.has(messageId)){
        return;
    }


    displayedMessages.add(messageId);


    if(emptyChat && emptyChat.parentNode){

        emptyChat.remove();

    }


    const row = document.createElement("div");

    row.className =
        "message-row " +
        (message.sender === "admin" ? "admin" : "client");


    const bubble = document.createElement("div");

    bubble.className =
        "message " +
        (message.sender === "admin" ? "admin" : "client");


    if(message.type === "image" && message.imageUrl){

        bubble.classList.add("image-message");


        const img = document.createElement("img");

        img.src = message.imageUrl;

        img.alt = message.fileName || "Photo";

        img.loading = "lazy";


        img.onerror = function(){

            bubble.classList.remove("image-message");

            bubble.innerHTML = `
                <div class="photo-status">
                    📷 Photo received by client
                </div>
            `;

        };


        bubble.appendChild(img);


        if(message.sender === "admin"){

            const meta = document.createElement("div");

            meta.className = "message-meta";

            meta.textContent =
                formatTime(message.timestamp) +
                (
                    message.savedLocally
                    ? " • Saved on client"
                    : ""
                );

            bubble.appendChild(meta);

        }


    }else{

        bubble.innerHTML =
            escapeHTML(message.text || "")
            +
            `
            <div class="message-meta">
                ${
                    message.sender === "admin"
                    ? "You"
                    : (message.clientName || selectedClientData?.name || "Client")
                }
                •
                ${formatTime(message.timestamp)}
            </div>
            `;

    }


    row.appendChild(bubble);

    messagesBox.appendChild(row);

    scrollMessages();

}


/* =========================
   SEND TEXT
========================= */

sendBtn.addEventListener("click", sendMessage);


messageInput.addEventListener("keydown", function(e){

    if(e.key === "Enter" && !e.shiftKey){

        e.preventDefault();

        sendMessage();

    }

});


function sendMessage(){

    if(!selectedClientId){

        alert("Please select a client first.");
        return;

    }


    const text = messageInput.value.trim();

    if(!text){
        return;
    }


    const messageRef =
        push(
            ref(
                db,
                "chats/" +
                selectedClientId +
                "/messages"
            )
        );


    const data = {

        sender: "admin",

        adminName: adminName,

        clientName:
            selectedClientData?.name || "",

        type: "text",

        text: text,

        timestamp: Date.now()

    };


    set(messageRef, data);


    set(
        ref(
            db,
            "chats/" +
            selectedClientId +
            "/lastMessageTime"
        ),
        Date.now()
    );


    messageInput.value = "";

}


/* =========================
   SEND PHOTO
========================= */

fileBtn.addEventListener("click", function(){

    if(!selectedClientId){

        alert("Please select a client first.");
        return;

    }

    fileInput.click();

});


fileInput.addEventListener("change", async function(){

    const file = fileInput.files[0];

    if(!file){
        return;
    }


    if(!selectedClientId){

        alert("Please select a client first.");

        fileInput.value = "";

        return;

    }


    if(!file.type.startsWith("image/")){

        alert("Please select an image file.");

        fileInput.value = "";

        return;

    }


    try{

        uploadStatus.style.display = "block";
        uploadStatus.textContent = "Uploading photo...";


        const safeName =
            file.name
                .replace(/[^a-zA-Z0-9._-]/g,"_");


        const path =
            "chat-images/" +
            selectedClientId +
            "/" +
            Date.now() +
            "_" +
            safeName;


        const imageRef =
            storageRef(storage, path);


        await uploadBytes(imageRef, file);


        uploadStatus.textContent =
            "Getting photo URL...";


        const imageUrl =
            await getDownloadURL(imageRef);


        const messageRef =
            push(
                ref(
                    db,
                    "chats/" +
                    selectedClientId +
                    "/messages"
                )
            );


        const data = {

            sender: "admin",

            adminName: adminName,

            clientName:
                selectedClientData?.name || "",

            type: "image",

            imageUrl: imageUrl,

            storagePath: path,

            fileName: file.name,

            timestamp: Date.now(),

            received: false,

            savedLocally: false

        };


        await set(messageRef, data);


        await set(
            ref(
                db,
                "chats/" +
                selectedClientId +
                "/lastMessageTime"
            ),
            Date.now()
        );


        uploadStatus.textContent =
            "Photo sent successfully.";


        setTimeout(function(){

            uploadStatus.style.display = "none";

        },1500);


    }catch(error){

        console.error(error);

        uploadStatus.textContent =
            "Upload failed: " + error.message;

        setTimeout(function(){

            uploadStatus.style.display = "none";

        },3000);

    }


    fileInput.value = "";

});


/* =========================
   DELETE CHAT
========================= */

deleteBtn.addEventListener("click", async function(){

    if(!selectedClientId){

        alert("Please select a client first.");
        return;

    }


    const clientName =
        selectedClientData?.name || "this client";


    if(!confirm(
        "Delete the entire chat with " +
        clientName +
        "?"
    )){

        return;

    }


    try{

        await remove(
            ref(
                db,
                "chats/" +
                selectedClientId
            )
        );


        selectedClientId = null;

        selectedClientData = null;

        messagesBox.innerHTML = `
            <div class="empty-chat">
                Select a client to view the conversation.
            </div>
        `;

        chatClientName.textContent =
            "Select a client";

        chatClientStatus.textContent =
            "No client selected";

        displayedMessages.clear();

        closeMobileChat();

        renderClients();

    }catch(error){

        console.error(error);

        alert(
            "Unable to delete chat: " +
            error.message
        );

    }

});


/* =========================
   HELPERS
========================= */

function scrollMessages(){

    requestAnimationFrame(function(){

        messagesBox.scrollTop =
            messagesBox.scrollHeight;

    });

}


function formatTime(timestamp){

    if(!timestamp){
        return "";
    }


    return new Date(timestamp).toLocaleString(
        "en-PH",
        {
            month:"short",
            day:"numeric",
            hour:"numeric",
            minute:"2-digit"
        }
    );

}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
